name: Update theater listings

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python fetch.py
      - name: Commit refreshed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data HEALTH.md
          if git diff --cached --quiet; then
            echo "Listings unchanged"
          else
            git commit -m "Update theater listings"
            git push
          fi
